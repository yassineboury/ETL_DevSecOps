name: "ETL DevSecOps Feature CI"

on:
  push:
    branches: [ "feature/*" ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality-check:
    name: Quality Check & Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: packages/etl-core
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install types-requests  # Pour MyPy
    
    - name: Black formatting check
      run: |
        black --check --diff .
    
    - name: Flake8 style check
      run: |
        flake8 --max-line-length=88 --extend-ignore=E203,W503 .
    
    - name: isort imports check
      run: |
        isort --check-only --profile black .
    
    - name: MyPy type checking
      run: |
        mypy etl/
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: CLI functionality test
      run: |
        python -m etl.cli test-gitlab --help

  us-001-validation:
    name: US-001 GitLab Connection Validation
    runs-on: ubuntu-latest
    needs: quality-check
    
    defaults:
      run:
        working-directory: packages/etl-core
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: US-001 specific tests
      run: |
        python -m pytest tests/unit/test_extractors.py::TestGitLabONCFConnection -v
    
    - name: Quality script validation
      run: |
        chmod +x check_quality.sh
        # Note: Le script utilise l'environnement local, donc on teste juste la syntaxe
        bash -n check_quality.sh
